# FlexiSIP configuration stub for Phase 0
# Full production configuration requires domain certificates and credentials.
# See: https://www.linphone.org/en/flexisip-sip-server

[global]
transports=sip:0.0.0.0:5060
default-latency=100

[module::Registrar]
enabled=true
db-connection-string=postgresql://viro:viro_dev_password@postgres:5432/viro_reach

[module::Authentication]
enabled=true
auth-domains=localhost

[module::MediaRelay]
enabled=false
