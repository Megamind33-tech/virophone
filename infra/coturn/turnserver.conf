# Viro Reach coturn configuration (development)
#
# static-auth-secret MUST match the API's TURN_SECRET (default: dev_turn_secret)
# so that the REST credentials issued by /api/v1/turn/credentials authenticate.
# docker-compose.yml overrides this value from ${TURN_SECRET} on the command
# line; the value below is the default used when running coturn directly.
listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=dev_turn_secret
realm=viro-reach.local

# Relay port range used for allocated media relays.
min-port=49160
max-port=49200

# Development runs without TLS certificates.
no-tls
no-dtls

no-multicast-peers
no-cli
log-file=stdout
verbose
