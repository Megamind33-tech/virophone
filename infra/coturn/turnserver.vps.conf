# Viro Reach coturn configuration (production / VPS)
#
# Runtime-specific values (secret, realm, listening port, external IP) are
# supplied on the command line by docker-compose.vps.yml from .env.vps so this
# file can stay in source control without embedding secrets:
#   --static-auth-secret=${TURN_SECRET}
#   --realm=${TURN_REALM}
#   --listening-port=${VIRO_TURN_PORT}
#   --external-ip=${EXTERNAL_IP}
#
# static-auth-secret MUST equal the API's TURN_SECRET for REST credentials
# issued by /api/v1/turn/credentials to authenticate.

fingerprint
lt-cred-mech
use-auth-secret

# Relay media port range. Open these UDP ports on the VPS firewall along with
# the listening port (TCP+UDP).
min-port=49160
max-port=49200

# Harden the relay: never relay to loopback / private ranges or multicast.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Reduce attack surface.
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce=600

log-file=stdout
simple-log
