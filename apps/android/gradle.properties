# The build machine's connections are intercepted by something whose root
# certificate is in the Windows store but not the JVM's bundled truststore,
# so every dependency fetch failed SSL handshakes. WINDOWS-ROOT makes the JVM
# trust the machine's store as well — the same idea as Node's --use-system-ca
# in scripts/distribute-android.sh, and verification stays on.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# libsignal's native library is over 100 MB, and a slow or stalling connection
# hits Gradle's 30-second default read timeout part-way through the download.
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=120000
