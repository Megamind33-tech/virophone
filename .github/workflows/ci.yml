name: Viro Reach CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viro
          POSTGRES_PASSWORD: viro_test
          POSTGRES_DB: viro_reach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            packages/shared-types/package-lock.json
            packages/api-contracts/package-lock.json
            apps/api/package-lock.json

      - name: Install shared packages
        run: |
          cd packages/shared-types && npm install && npm run build
          cd ../api-contracts && npm install && npm run build

      - name: Install API dependencies
        run: cd apps/api && npm install

      - name: Lint API
        run: cd apps/api && npm run lint

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://viro:viro_test@localhost:5432/viro_reach_test
        run: cd apps/api && npm run migration:run

      - name: Test API
        env:
          DATABASE_URL: postgresql://viro:viro_test@localhost:5432/viro_reach_test
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          CONTACT_HASH_SALT: test_salt
        run: cd apps/api && npm test

      - name: Build API
        run: cd apps/api && npm run build

      - name: Secret scan
        run: |
          if grep -rn "dev_access_secret_change_in_production" .env 2>/dev/null; then
            echo "ERROR: .env file committed"
            exit 1
          fi
          echo "No committed secrets detected"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and test Android
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleDebug test lint --no-daemon
