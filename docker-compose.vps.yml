# Viro Reach — isolated VPS stack (separate from other apps on same server)
# Project name: viro-reach  →  containers/volumes prefixed, no collision with other compose projects
#
# Usage from LOCAL PC:
#   cp .env.vps.example .env.vps && edit values
#   ./scripts/vps-deploy.sh
#
# Caddy modes (set in .env.vps):
#   VIRO_CADDY_MODE=container  — Viro runs its own Caddy (only if ports 80/443 are free)
#   VIRO_CADDY_MODE=existing   — API only exposed on 127.0.0.1:13001; add Caddy snippet on host

name: viro-reach

services:
  postgres:
    image: postgres:16-alpine
    container_name: viro-reach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - viro_reach_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - viro_reach_internal

  redis:
    image: redis:7-alpine
    container_name: viro-reach-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - viro_reach_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - viro_reach_internal

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: viro-reach-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_BASE_URL: https://${CADDY_DOMAIN}
      # Base for URLs handed to phones (avatars). Must be the public host.
      API_PUBLIC_URL: https://${CADDY_DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CONTACT_HASH_SALT: ${CONTACT_HASH_SALT}
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: ${CADDY_DOMAIN}
      TURN_PORT: ${VIRO_TURN_PORT:-3479}
      TURN_REALM: ${TURN_REALM:-viro-reach}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      EPHEMERAL_SIGNING_SECRET: ${EPHEMERAL_SIGNING_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-console}
      # Beem Africa SMS — the OTP path for real users. Empty by default so a
      # deployment without credentials falls back rather than failing to boot.
      BEEM_API_KEY: ${BEEM_API_KEY:-}
      BEEM_SECRET_KEY: ${BEEM_SECRET_KEY:-}
      BEEM_SOURCE_ADDR: ${BEEM_SOURCE_ADDR:-INFO}
      SMS_BODY_TEMPLATE: ${SMS_BODY_TEMPLATE:-}
      OTP_PROVIDER_TEST_CODE: ${OTP_PROVIDER_TEST_CODE:-}
      TEST_OTP_CODE: ${TEST_OTP_CODE:-}
      HARDWARE_TEST_PHONES_E164: ${HARDWARE_TEST_PHONES_E164:-}
      HARDWARE_TEST_OTP_CODE: ${HARDWARE_TEST_OTP_CODE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OTP_EMAIL_FROM: ${OTP_EMAIL_FROM:-}
      OTP_DELIVERY_EMAIL: ${OTP_DELIVERY_EMAIL:-}
      OTP_EMAIL_MAP: ${OTP_EMAIL_MAP:-}
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      # Push. The service-account key is MOUNTED rather than inlined as JSON:
      # a key with embedded newlines in an env file that is both sourced by bash
      # and parsed by compose is a reliable way to ship a subtly corrupt secret.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-log}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-admin.json
    volumes:
      # Without this, every container rebuild/redeploy silently wipes every
      # uploaded profile photo — the container filesystem is ephemeral.
      - viro_reach_avatars:/app/uploads/avatars
      # Read-only, and never part of the image or the synced tree.
      - ./secrets/firebase-admin.json:/app/secrets/firebase-admin.json:ro
    ports:
      - "${VIRO_API_BIND:-127.0.0.1:13001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - viro_reach_internal

  caddy:
    image: caddy:2-alpine
    container_name: viro-reach-caddy
    restart: unless-stopped
    profiles: ["viro-caddy"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${VIRO_HTTP_PORT:-8080}:80"
      - "${VIRO_HTTPS_PORT:-8443}:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./infra/proxy/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - viro_reach_caddy_data:/data
      - viro_reach_caddy_config:/config
    networks:
      - viro_reach_internal

  # Isolated LiveKit instance for Viro Reach's own voice calls — separate
  # container, ports, and API key/secret from any other LiveKit deployment
  # that may exist on this shared host for other apps.
  #
  # Config comes from a mounted YAML file (not individual env vars) because
  # TURN (see infra/livekit/livekit.vps.yaml) needs a mounted TLS cert/key
  # pair, which the env-var interface doesn't expose. TURNS on 5349 is the
  # fallback for networks that block direct UDP media entirely — without it,
  # calls connected (signaling isn't affected) but carried no audio.
  livekit:
    image: livekit/livekit-server:latest
    container_name: viro-reach-livekit
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml --node-ip=${EXTERNAL_IP}
    volumes:
      - ./infra/livekit/livekit.vps.yaml:/etc/livekit/livekit.yaml:ro
      - ./livekit-tls:/etc/livekit/tls:ro
    ports:
      - "127.0.0.1:7980:7980"
      - "${VIRO_LIVEKIT_TCP_BIND:-0.0.0.0}:7981:7981"
      - "${VIRO_LIVEKIT_UDP_BIND:-0.0.0.0}:51000-51100:51000-51100/udp"
      - "${VIRO_LIVEKIT_TURNS_BIND:-0.0.0.0}:5349:5349"
      - "${VIRO_LIVEKIT_TURN_RELAY_BIND:-0.0.0.0}:30000-30100:30000-30100/udp"
    # Without this the container lands on the default compose network and
    # the container-mode Caddy cannot resolve "livekit" to proxy its
    # signaling — the call then rings but never carries audio.
    networks:
      - viro_reach_internal

  coturn:
    image: coturn/coturn:latest
    container_name: viro-reach-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.vps.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--realm=${TURN_REALM:-viro-reach}"
      - "--listening-port=${VIRO_TURN_PORT:-3479}"
      - "--external-ip=${EXTERNAL_IP}"

networks:
  viro_reach_internal:
    driver: bridge

volumes:
  viro_reach_postgres:
  viro_reach_redis:
  viro_reach_caddy_data:
  viro_reach_caddy_config:
  viro_reach_avatars:
